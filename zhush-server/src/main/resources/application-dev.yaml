server:
  port: 9166
  servlet:
    context-path: /api

spring:
  # 文件上传大小限制（与 zhush.file.max-size 保持一致）
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  # Redis 连接（starter-redis / Redisson / Sa-Token 共用）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: 123456
      timeout: 5s
  # 全文搜索连接（仅 zhush.search.enabled=true 时实际使用）
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 5s
    socket-timeout: 30s
  datasource:
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      filter:
        stat:
          enabled: true
          log-slow-sql: true # 慢 SQL 记录
          slow-sql-millis: 100
          merge-sql: true
        wall:
          enabled: true
          config:
            multi-statement-allow: true
      stat-view-servlet:
        enabled: false   # 关闭 Druid Web 暴露，统计改由 /admin/system/monitor/druid/** 授权接口输出
  # 定时任务调度器（Quartz JDBC 持久化；建表脚本：sql/07_quartz.sql）
  quartz:
    job-store-type: jdbc            # memory（内存，重启丢失）/ jdbc（持久化）
    jdbc:
      initialize-schema: never      # 表结构由 sql/07_quartz.sql 维护，不由框架自动建表
    properties:
      org.quartz.scheduler.instanceName: zhushScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.threadPool.threadCount: 10
      # org.quartz.jobStore.isClustered: true   # 多实例集群部署时开启

mybatis-flex:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  datasource:
    # --- 主库（默认数据源）---
    master:
      type: com.alibaba.druid.pool.DruidDataSource
      url: jdbc:mysql://localhost:3306/zhush?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: root
      password: topfus@123
      # Druid 连接池属性（直接写 setter 对应的 key）
      initialSize: 5
      maxActive: 20
      minIdle: 5
      maxWait: 60000
      validationQuery: SELECT 1
      testWhileIdle: true

# Sa-Token 认证（管理端 / 会员端）
# access-token 即 Sa-Token 令牌：从 Authorization: Bearer xxx 请求头读取，不写 Cookie（防 CSRF）；
# 有效期 2 小时，由 /admin/auth/refresh 的 refresh-token 机制负责无感续期。
sa-token:
  token-name: Authorization      # 从 Authorization 请求头读取 token
  token-prefix: Bearer           # 兼容 "Bearer xxx" 格式
  timeout: 7200                  # access-token 有效期 2 小时（秒）
  active-timeout: -1             # 不做活跃自动续期，严格 2 小时，靠 refresh-token 续期
  is-concurrent: true            # 允许同账号多端并发登录（PC / APP / MINI 共存）
  is-share: false                # 每次登录产生新 token（配合同端互踢）
  is-read-cookie: false          # access-token 不读写 Cookie，防 CSRF
  is-read-header: true           # 从请求头读取 token
  token-style: uuid              # token 风格
  is-log: false                  # 关闭 Sa-Token 操作日志（避免刷屏）

logging:
  level:
    com.zhush: debug
    com.mybatisflex: debug

# 接口文档（Knife4j + SpringDoc）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn

# 启用加解密（默认 true）
zhush:
  # ---- 安全 / 鉴权（Sa-Token 拦截器规则）----
  # 注意：Sa-Token 的 SaRouter 使用原始 requestURI 匹配（ApplicationInfo.routePrefix 未被赋值，不会裁剪 context-path），
  #      故 admin/member 前缀与白名单均需带 context-path 前缀 /api；未带前缀的写法由 SaTokenConfigure 自动补全。
  security:
    admin-prefix: /api/admin/**        # 管理端路径：校验管理端登录态，接口权限由 @SaCheckPermission(type="admin") 按需校验
    member-prefix: /api/member/**      # 会员端路径：仅校验会员端登录态
    ignore-paths:                      # 免登录白名单（与代码内置 DEFAULT_IGNORE_PATHS 合并，追加不覆盖）
      # --- 认证类：位于 admin/member 前缀内，必须放行 ---
      - /api/admin/auth/login
      - /api/admin/auth/refresh
      - /api/admin/auth/social-login
      - /api/admin/auth/captcha        # 管理端登录验证码（内置白名单未含，@IgnoreAuth 已放行，此处双保险）
      - /api/member/auth/login
      - /api/member/auth/wx-mini-login
      - /api/member/auth/captcha       # 会员端登录验证码（同上）
      # --- 协议与开放接口 ---
      - /api/oauth2/**
      - /api/open/**
      # --- 基础与静态资源 ---
      - /api/error
      - /api/favicon.ico
      - /api/files/**                  # 本地存储文件访问（头像、上传文件预览）
      # --- 渠道回调（免登录，强制验签；业务层 @IgnoreAuth 已放行，此处双保险）---
      # --- 接口文档 ---
      - /api/doc.html
      - /api/swagger-ui/**
      - /api/swagger-resources/**
      - /api/v3/api-docs/**
      - /api/webjars/**
  encrypt:
    enabled: true
    sm4-key: your-16-char-key    # 可选，不配则走 SmUtils 默认密钥策略（必须16字节）
  # 接口幂等（@Idempotent + Redis 去重）：默认开启，zhush.idempotent.enabled=false 可整体关闭
  idempotent:
    enabled: true
  # SQL 审计（基于 MyBatis-Flex AuditManager，批量落库 sys_sql_audit_log）：enabled=false 不装配
  sql-audit:
    enabled: true
    batch-size: 50                   # 攒够 N 条批量落库
    sample-rate: 100                 # 采样率%，100 全量（开发环境便于观察）
    only-write: false                # true 仅记写操作，跳过 SELECT
    slow-sql-threshold: 0            # >0 仅记耗时≥该值(ms) 的慢 SQL；0 不按耗时过滤
    ignore-tables:                   # SQL 命中这些表名即不落库（降噪/防递归）
      - sys_sql_audit_log
      - sys_operate_log
      - sys_login_log
  # 行为验证码（tianai-captcha 封装，管理端/会员端登录共用）
  captcha:
    enabled: true                    # 总开关：false 不装配验证码，登录自动跳过校验
    login-required: true             # 登录是否强制校验验证码
    type: SLIDER                     # SLIDER-滑块 ROTATE-旋转 CONCAT-拼图
    image-format: JPEG_PNG               # 图片格式：WEBP / JPEG_PNG
    expire-seconds: 120              # 验证码有效期（秒）
  # 文件存储（starter-file 自研多存储抽象）：切换存储只需修改 primary
  file:
    enabled: true
    primary: local                       # local / aliyun-oss / qiniu / huawei-obs
    max-size: 52428800                   # 单文件上限 50MB（字节）
    # allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,zip   # 扩展名白名单，不配则不限制
    local:
      enabled: true
      base-path: D:/zhush/upload/        # 本地存储根目录
      domain: http://localhost:9166/api/files/  # 文件访问 URL 前缀（含 context-path=/api）
      url-path: /files/**                # 静态资源映射路径
    aliyun-oss:
      enabled: false
      endpoint: your-endpoint
      access-key-id: your-access-key-id
      access-key-secret: your-access-key-secret
      bucket-name: your-bucket-name
      domain: ""                         # 为空时按 https://{bucket}.{endpoint}/ 拼接
    qiniu:
      enabled: false
      access-key: your-access-key
      secret-key: your-secret-key
      bucket: your-bucket
      domain: https://your-domain/
    huawei-obs:
      enabled: false
      endpoint: your-endpoint
      access-key: your-access-key
      secret-key: your-secret-key
      bucket-name: your-bucket-name
      domain: ""                         # 为空时按 https://{bucket}.{endpoint}/ 拼接
  # 会话产物在线预览（详见 docs/AI智能助手文件预览功能方案.md §6.5）
  # office-converter：none=路线乙（纯前端渲染）；libreoffice=甲-1（服务端转 PDF，本机需装 LibreOffice）；kkfileview=甲-2 未实现
  preview:
    enabled: true
    office-converter: none # none/ libreoffice/ kkfileview
    # allowed-extensions: png,jpg,jpeg,gif,webp,mp4,webm,md,txt,csv,html,htm,pdf,docx,xlsx   # 不配则用内置默认表；与 zhush.file.allowed-extensions 是两个口径
    # prefer-pdf-extensions: docx,xlsx     # 前端本就能渲染的格式，显式列出才改走服务端转 PDF
    convert:
      # soffice-path: D:/Program Files/LibreOffice/program/soffice.exe   # Windows 需写完整路径；Linux 默认 soffice
      # cache-path: D:/zhush/preview-cache  # 不配则取本地存储根的同级 preview-cache 目录（刻意在免鉴权的 /api/files/** 之外）
      max-concurrent: 1                     # office 进程上限，防一份大 PPT 拖垮后端
      timeout-seconds: 60                   # 单文档转换超时，超时即杀进程并降级 unsupported
    # 路线甲-2（office-converter=kkfileview）才用到的三项；dev 的产物地址已是绝对地址，source-base-url 可留空
    # base-url: /preview                    # 需 vite 把 /preview 代理到 kkFileView，且容器侧 KK_BASE_URL 指回 dev 源
    # source-base-url:                      # 仅产物地址为相对前缀（docker 的 FILE_DOMAIN=/api/files/）时才需要
    # probe-url: http://localhost:8012/     # 配了才会在服务不可达时回落「仅下载」，不配只能由前端 iframe 自己报错
    # 回答正文引用文件登记（把 AI 写在正文里的本地路径升格为可预览产物）
    # answer-file-enabled: true                        # 关掉后前端点击提示「请下载后查看」
    # answer-file-workspace-root: .agentscope/workspace # harness 工作区根，相对路径按进程工作目录解析，需与 AgentScope 实际写入的根一致
    # answer-file-max-size: 20971520                   # 单个源文件体积上限（字节），超出直接拒绝登记
  # 全文搜索（Elasticsearch）：默认关闭；启用时改为 true 并确认 spring.elasticsearch.uris 指向实际地址
  search:
    enabled: false
  # 数据权限：开发环境开启，用于验证角色数据范围（行级过滤）与字段权限（响应置空）
  # 关闭时 @DataPermission / @FieldPermission 注解无副作用，切面与方言不会注册
  data-permission:
    enabled: true
    row-enabled: true    # 行级权限（@DataPermission 自动拼接 SQL 过滤）
    field-enabled: true  # 字段级权限（@FieldPermission 响应置空/脱敏）
  # 监控（Spring Boot Admin）：默认关闭；启用时改为 true 并放开下方 spring.boot.admin 与 management 配置
  monitor:
    enabled: false
    # server-enabled: true   # 内嵌 Admin 服务端；已有独立 Admin Server 时设为 false 仅作客户端注册
  web:
    cors:
      enabled: true                  # 默认开启,false 整体关闭
      path-pattern: /**
      allowed-origin-patterns: "*"   # 生产建议收敛,如 https://*.zhush.com
      allowed-methods: "*"
      allowed-headers: "*"
      exposed-headers: Content-Disposition   # 需要前端读取的响应头(如文件下载)
      allow-credentials: true
      max-age: 3600
  # 定时任务（Quartz）：任务管理模块（系统监控-定时任务）启用，持久化配置见下方 spring.quartz（需先执行 sql/07_quartz.sql）
  job:
    enabled: true
    # default-group: DEFAULT    # 未指定分组时的默认分组（与 sys_job.job_group 默认值一致）
  # 消息队列（RocketMQ）：默认关闭；启用时改为 true 并确认 namesrv-addr 指向实际地址
  mq:
    enabled: false
    # namesrv-addr: 127.0.0.1:9876
    # access-key: ""              # 开启 ACL 时配置
    # secret-key: ""
    # producer:
    #   enabled: true             # 仅需要消费时可关闭生产者
    #   group: zhush_producer_group
    #   send-timeout: 3000
    #   retry-times: 2
  # WebSocket 推送：默认关闭；启用后客户端通过 ws://host:port/ws?userId=xxx 连接
  websocket:
    enabled: false
    # endpoint: /ws               # 端点路径
    # allowed-origins: "*"        # 生产建议收敛来源

  # 智能体（AgentScope）：默认关闭；启用前请确认模型供应商 api-key 已通过环境变量注入
  agentscope:
    enabled: true
    default-model: deepseek-chat
    models:
      dashscope: { type: dashscope, api-key: "${DASHSCOPE_API_KEY:}", model: qwen-max }
      deepseek:  { type: openai, api-key: "${DEEPSEEK_API_KEY:}", base-url: https://api.deepseek.com/v1, model: deepseek-chat }
      local:     { type: ollama, base-url: http://localhost:11434, model: qwen2.5:7b }
    session-store: redis      # 会话存储：redis / memory
    session-ttl: 24h          # 会话 TTL（Redis 过期回收）
    request-timeout: 60s
    event-async: true           # 事件异步分发：审计/用量落库不阻塞 SSE 尾包
    event-pool-size: 2          # 事件分发线程数
    event-queue-capacity: 1000  # 分发队列容量（饱和退化同步，不丢事件）
    usage:                      # Token 真实计量与日聚合（agent_token_usage）
      enabled: true
      cost-enabled: true        # 成本估算（单价取 ai_model.input_price/output_price，缺价记 0）
    dynamic-config:            # 模型/敏感词库表动态化（空库自动回退 yaml）
      enabled: true
      refresh-interval: 300s   # 定时兜底刷新周期
      broadcast: true          # 多实例 Redis pub/sub 广播
    safety:
      approval-enabled: true
      sensitive-keywords: [删除, 转账, 下单, 退款]
    jev:                          # Jev 判断模型（TypeSafe AI 结构化决策，方案《AgentScope2.0-Jev判断模型集成方案》）
      enabled: ${JEV_ENABLED:false}  # 总开关：关闭/无 Key 时 JevClient 不装配，意图路由等能力自动降级（不报错）
      api-key: ${TYPESAFE_API_KEY:}  # 获取：https://console.typesafe.ai/ 控制台创建；建议仅环境变量注入
      base-url: https://api.typesafe.ai
      model: jev-latest
      timeout: 2s                 # 判断在用户中断链路上，较官方默认 5s 收紧
      max-retries: 1              # 429/5xx 指数退避，链路内保守配置
      fail-open: true             # Jev 失败一律降级（意图回 chat），不阻断主流程
      intent-confidence-threshold: 0.6   # 低置信宁不分类不乱分类
      log-sample-rate: 0.1        # 决策记录采样（degraded/sticky 全量）
      sticky:                     # 同会话跟进消息复用上轮分类（降决策量）
        ttl: 5m
        max-message-length: 16
    web-search: # 联网搜索（方案《AI智能助手联网搜索方案》6.1）：出网能力默认关闭，开启需 enabled=true 且密钥可得
      enabled: ${WEB_SEARCH_ENABLED:false}
      provider: ${WEB_SEARCH_PROVIDER:mock} # dev 默认 mock：本地无密钥即可验证工具注册、调用与回包形态
      api-key: ${WEB_SEARCH_API_KEY:} # 仅环境变量注入，禁止写入仓库/落日志
      engine-type: LiteAdvanced # IQS 引擎档位（provider=iqs 时生效）
      session-default-enabled: true # 请求未带联网开关时的默认值：true 表示模型可按意图自主联网
      search: # L1 检索
        timeout: 8s # 官方内置实现默认 30s，卡在用户中断链路上等不起
        max-results: 5
        max-results-limit: 10 # 模型可请求的条数上限
        cache-ttl: 30m
        cache-max-entries: 500
        snippet-max-chars: 500
      fetch: # L2 抓取
        enabled: true # 子开关：总开关 enabled=false 时不生效
        timeout: 10s
        max-bytes: 1048576 # 单次下载 1MB 封顶，防大文件/无限流打满堆
        max-chars: 8000
        follow-redirects: true # 重定向逐跳重过 SSRF 闸门，非盲跟
        max-redirects: 3
        allow-private-network: false # 容器 host 网络 + privileged，内网/元数据地址一律拒绝
        domain-deny-list: []
        domain-allow-list: [] # 非空即白名单模式，未列入域名一律拒绝
      quota: # ReAct 单轮最多可打出 max-steps 次搜索，配额是必需的
        calls-per-session: 20
        calls-per-day-per-user: 200
      builtin-tools: # Harness 内置出网/命令/文件工具收敛（P0）：改任一项即扩大攻击面
        disable-web: true
        disable-shell: true
        disable-filesystem: true
  # 统一支付底座（zhush-module-pay）：微信支付渠道
  # 默认全部关闭：未启用时不装配任何支付 Bean；启用 V3/V2 前必须配齐凭证，缺失将启动失败（fail-fast）
  # 凭证纪律：全部经环境变量外置，证书走挂载卷，禁止入库/入代码
  pay:
    wx:
      enabled: ${WX_PAY_ENABLED:false}          # 总开关
      primary-mch-id: ${WX_PAY_MCH_ID:}         # 默认商户号（多商户路由预留）
      notify-url: ${WX_PAY_NOTIFY_URL:}         # 默认回调前缀（可被业务命令覆盖）
      # --- 微信 V3：商家转账 transfer-bills（有回调、可撤销）---
      v3:
        enabled: ${WX_PAY_V3_ENABLED:false}
        app-id: ${WX_PAY_V3_APP_ID:}
        mch-id: ${WX_PAY_V3_MCH_ID:}
        api-v3-key: ${WX_PAY_V3_API_KEY:}
        cert-serial-no: ${WX_PAY_V3_CERT_SERIAL_NO:}
        private-key-path: ${WX_PAY_V3_PRIVATE_KEY_PATH:}
        public-key-id: ${WX_PAY_V3_PUBLIC_KEY_ID:}
        public-key-path: ${WX_PAY_V3_PUBLIC_KEY_PATH:}
        transfer-scene-id: ${WX_PAY_V3_TRANSFER_SCENE_ID:}    # 转账场景ID（商户平台申请）
        transfer-remark: 佣金提现
        user-recv-perception: ${WX_PAY_V3_RECV_PERCEPTION:}
        receipt-authorization-mode: ${WX_PAY_V3_RECEIPT_AUTH_MODE:}
        # transfer-scene-report-infos:                        # 转账场景报备信息（必填）
        #   - info-type: transfer_scene_report_infos
        #     info-content: xxx
      # --- 微信 V2：企业付款到银行卡 ent-pay（无回调，靠定时查单收敛）---
      v2:
        enabled: ${WX_PAY_V2_ENABLED:false}
        app-id: ${WX_PAY_V2_APP_ID:}
        mch-id: ${WX_PAY_V2_MCH_ID:}
        mch-key: ${WX_PAY_V2_MCH_KEY:}
        ent-pay-key: ${WX_PAY_V2_ENT_PAY_KEY:}
        key-path: ${WX_PAY_V2_KEY_PATH:}         # PKCS12 商户证书（口令由 SDK 以商户号解析）
        sign-type: ${WX_PAY_V2_SIGN_TYPE:HMAC-SHA256}
        use-sandbox-env: false
      # --- 单笔出款限额（单位：分）---
      limit:
        wechat-v3:
          min-amount: ${WX_PAY_V3_MIN_AMOUNT:1}
          max-amount: ${WX_PAY_V3_MAX_AMOUNT:2000000}
        wechat-v2:
          min-amount: ${WX_PAY_V2_MIN_AMOUNT:1}
          max-amount: ${WX_PAY_V2_MAX_AMOUNT:5000000}

# --- 定时任务（zhush.job.enabled=true）已启用：Quartz 持久化配置已合入上方 spring.quartz ---

# ES 健康检查随搜索开关同步启停（启用搜索后改为 true）
management:
  health:
    elasticsearch:
      enabled: false
  # --- 启用监控（zhush.monitor.enabled=true）时同步放开：SBA 需读取全部 actuator 端点 ---
  # endpoints:
  #   web:
  #     exposure:
  #       include: "*"
  # endpoint:
  #   health:
  #     show-details: always

# --- 启用监控时同步放开：内嵌 SBA 服务端 UI 路径 + 客户端自注册 ---
# spring:
