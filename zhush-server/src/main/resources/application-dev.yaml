server:
  port: 9166

spring:
  # 全文搜索连接（仅 zhush.search.enabled=true 时实际使用）
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 5s
    socket-timeout: 30s
  datasource:
    druid:
      initial-size: 5
      max-active: 20
      min-idle: 5
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      filter:
        stat:
          enabled: true
          log-slow-sql: true # 慢 SQL 记录
          slow-sql-millis: 100
          merge-sql: true
        wall:
          enabled: true
          config:
            multi-statement-allow: true
      stat-view-servlet:
        enabled: true
        allow: # 设置白名单，不填则允许所有访问
        url-pattern: /druid/*
        login-username: admin
        login-password: your_password

mybatis-flex:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  datasource:
    # --- 主库（默认数据源）---
    master:
      type: com.alibaba.druid.pool.DruidDataSource
      url: jdbc:mysql://localhost:3306/zhush_main?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: root
      password: password
      # Druid 连接池属性（直接写 setter 对应的 key）
      initialSize: 5
      maxActive: 20
      minIdle: 5
      maxWait: 60000
      validationQuery: SELECT 1
      testWhileIdle: true

    # --- 从库（只读/报表库）---
    slave:
      type: com.alibaba.druid.pool.DruidDataSource
      url: jdbc:mysql://localhost:3306/zhush_slave?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      username: readonly
      password: readonly_pass
      initialSize: 3
      maxActive: 10
      minIdle: 3
      maxWait: 60000
      validationQuery: SELECT 1
      testWhileIdle: true

logging:
  level:
    com.zhush: debug
    com.mybatisflex: debug

# 接口文档（Knife4j + SpringDoc）
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn

# 启用加解密（默认 true）
zhush:
  encrypt:
    enabled: true
    sm4-key: your-16-char-key    # 可选，不配则走 SmUtils 默认密钥策略（必须16字节）
  # 全文搜索（Elasticsearch）：默认关闭；启用时改为 true 并确认 spring.elasticsearch.uris 指向实际地址
  search:
    enabled: false
  # 数据权限：默认关闭；启用后可通过 row-enabled / field-enabled 单独控制行级、字段级
  data-permission:
    enabled: false
    # row-enabled: true    # 行级权限（@DataPermission 自动拼接 SQL 过滤）
    # field-enabled: true  # 字段级权限（@FieldPermission 响应置空/脱敏）
  # 监控（Spring Boot Admin）：默认关闭；启用时改为 true 并放开下方 spring.boot.admin 与 management 配置
  monitor:
    enabled: false
    # server-enabled: true   # 内嵌 Admin 服务端；已有独立 Admin Server 时设为 false 仅作客户端注册
  web:
    cors:
      enabled: true                  # 默认开启,false 整体关闭
      path-pattern: /**
      allowed-origin-patterns: "*"   # 生产建议收敛,如 https://*.zhush.com
      allowed-methods: "*"
      allowed-headers: "*"
      exposed-headers: Content-Disposition   # 需要前端读取的响应头(如文件下载)
      allow-credentials: true
      max-age: 3600

# ES 健康检查随搜索开关同步启停（启用搜索后改为 true）
management:
  health:
    elasticsearch:
      enabled: false
  # --- 启用监控（zhush.monitor.enabled=true）时同步放开：SBA 需读取全部 actuator 端点 ---
  # endpoints:
  #   web:
  #     exposure:
  #       include: "*"
  # endpoint:
  #   health:
  #     show-details: always

