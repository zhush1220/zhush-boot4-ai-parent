services:
  mysql:
    image: mysql:8.4.5
    network_mode: "host"
    container_name: mysql
    hostname: mysql
    privileged: true
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: zhusH@950120
      MYSQL_ROOT_HOST: '%'
    volumes:
      - ./log:/var/log/mysql
      - ./data:/var/lib/mysql
      - ./my.cnf:/etc/my.cnf:ro
      - /etc/localtime:/etc/localtime:ro
