services:
  redis:
    image: redis:7.4-alpine
    network_mode: "host"
    container_name: redis
    hostname: redis
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
      - ./redis.conf:/etc/redis/redis.conf
    command: "redis-server /etc/redis/redis.conf --appendonly yes --requirepass zhush!735@6"