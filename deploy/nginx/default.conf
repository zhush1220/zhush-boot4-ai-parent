server {
    listen       8086;
    server_name  47.115.56.72;

    location / {
        root   /usr/share/nginx/html/dist;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 后端接口代理：保留 /api 前缀转发到后端 9199（后端 server.servlet.context-path=/api，不可去前缀）
    location /api {
        proxy_pass http://172.17.0.1:9199/api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;   # 必须用 $http_host（含端口）：$host 不带端口会让后端误判为跨域请求并返回 403
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        # 支持 SSE 流式输出（AI 对话）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 本地文件服务（头像/上传文件预览）：对外保留 /files 前缀，转发时补 /api 前缀
    # （后端 context-path=/api，静态资源映射 /files/** 实际暴露为 /api/files/**）
    location /files {
        proxy_pass http://172.17.0.1:9199/api/files;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;   # 必须用 $http_host（含端口）：$host 不带端口会让后端误判为跨域请求并返回 403
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 在线文档预览：路线甲-2 的 kkFileView（office-converter=kkfileview 时才需要）
    # 只放行 GET/HEAD：kkFileView 带上传与删除接口，同源暴露后不能被当成写入口（方案 S9）
    # KK_BASE_URL 必须配成 http://<对外地址>:8086/preview/，否则预览页里的子资源会指向容器内网
    location /preview {
        limit_except GET HEAD { deny all; }

        proxy_pass http://172.17.0.1:8012/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        # 大文档串行转换，响应可能几十秒才回来
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 可选：添加一个错误页面配置
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
