services:
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    restart: always
    network_mode: "host"
    volumes:
      # 单文件挂载：仓库配置为 default.conf（原挂载 ./conf 目录与实际文件不匹配，配置不会生效）
      - ./default.conf:/etc/nginx/conf.d/default.conf
      - ./html:/usr/share/nginx/html
      - ./logs:/var/log/nginx
    environment:
      - TZ=Asia/Shanghai
    